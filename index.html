<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B5D3B" />
    <meta name="description" content="Pharmacies de garde autour de vous à Rabat, Salé et Témara : sources datées, carte, classement par proximité et itinéraires." />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Pharmacies de Garde Maroc</title>
    <style>
      /* ===== Écran de lancement : visuel fourni, affiché tel quel, + animations superposées ===== */
      #splash { position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: #061a32; cursor: default; -webkit-user-select: none; user-select: none; transition: opacity .6s ease; }
      #splash.sp-out { opacity: 0; pointer-events: none; }
      /* fond flou pour les écrans larges (le visuel est affiché en entier au centre) */
      #splash .sp-fill { position: absolute; inset: -40px; background: url("/src/assets/splash-garde-941.webp") center / cover no-repeat; filter: blur(28px) brightness(.55); transform: scale(1.1); }
      /* le visuel garde ses proportions (941 × 1672) ; les animations utilisent les mêmes coordonnées */
      #splash .sp-art { position: absolute; left: 50%; top: 50%; width: min(100vw, calc(100vh * 941 / 1672)); width: min(100vw, calc(100dvh * 941 / 1672)); aspect-ratio: 941 / 1672; transform: translate(-50%, -50%); box-shadow: 0 0 60px rgba(0,0,0,.45); }
      /* téléphones et écrans en hauteur : le visuel remplit tout l'écran (léger rognage des bords) */
      @media (max-aspect-ratio: 62/100) { #splash .sp-art { width: max(100vw, calc(100vh * 941 / 1672)); width: max(100vw, calc(100dvh * 941 / 1672)); box-shadow: none; transform: translate(-51.6%, -50%); } }
      #splash .sp-art img, #splash .sp-art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #splash .sp-art img { object-fit: cover; }
      #splash .sp-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      /* repli si GSAP ne se charge pas : la roue tourne quand même */
      #splash #sp-spin { transform-origin: 472px 1452px; animation: sp-rot 1.1s linear infinite; }
      #splash.gsap #sp-spin { animation: none; }
      @keyframes sp-rot { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #splash #sp-spin { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Chargement de Pharmacies de Garde Maroc">
      <div class="sp-fill" aria-hidden="true"></div>
      <div class="sp-art">
        <img src="/src/assets/splash-garde-1882.webp" srcset="/src/assets/splash-garde-941.webp 941w, /src/assets/splash-garde-1882.webp 1882w" sizes="(max-aspect-ratio: 62/100) 57vh, 57vh" alt="Pharmacies de Garde Maroc — Trouvez une pharmacie de garde près de vous" width="941" height="1672" fetchpriority="high" decoding="async" />
        <svg viewBox="0 0 941 1672" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <radialGradient id="spGlow"><stop offset="0" stop-color="#5ff6ea" stop-opacity=".75" /><stop offset=".45" stop-color="#22d3c5" stop-opacity=".25" /><stop offset="1" stop-color="#22d3c5" stop-opacity="0" /></radialGradient>
            <radialGradient id="spStar"><stop offset="0" stop-color="#fff" /><stop offset=".3" stop-color="#bffcf6" stop-opacity=".8" /><stop offset="1" stop-color="#22d3c5" stop-opacity="0" /></radialGradient>
            <linearGradient id="spArc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ff7ec" /><stop offset="1" stop-color="#0fbfb2" /></linearGradient>
            <linearGradient id="spShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#fff" stop-opacity=".55" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
            <clipPath id="spLogoClip"><circle cx="470" cy="262" r="92" /></clipPath>
          </defs>
          <g style="mix-blend-mode: screen">
            <!-- halo du logo + reflet qui balaie le repère + étincelle sur l'anneau -->
            <circle id="sp-logo-glow" cx="470" cy="270" r="190" fill="url(#spGlow)" opacity="0" />
            <g clip-path="url(#spLogoClip)"><rect id="sp-shine" x="250" y="140" width="70" height="260" fill="url(#spShine)" transform="rotate(20 470 262)" opacity="0" /></g>
            <circle id="sp-sat" cx="605" cy="236" r="16" fill="url(#spStar)" opacity="0" />
            <!-- ondes sous les repères de la carte -->
            <g fill="none" stroke="#5ff6ea" stroke-width="5">
              <ellipse class="sp-rip r-main" cx="470" cy="1212" rx="78" ry="24" opacity="0" />
              <ellipse class="sp-rip r-main" cx="470" cy="1212" rx="78" ry="24" opacity="0" />
              <ellipse class="sp-rip r-side" cx="127" cy="1212" rx="26" ry="8" opacity="0" />
              <ellipse class="sp-rip r-side" cx="808" cy="1184" rx="26" ry="8" opacity="0" />
            </g>
            <circle id="sp-main-glow" cx="470" cy="1105" r="120" fill="url(#spGlow)" opacity="0" />
            <circle class="sp-side-glow" cx="127" cy="1170" r="55" fill="url(#spGlow)" opacity="0" />
            <circle class="sp-side-glow" cx="808" cy="1145" r="55" fill="url(#spGlow)" opacity="0" />
            <!-- scintillement des lumières de la ville -->
            <g id="sp-twinkles" fill="url(#spStar)">
              <circle cx="107" cy="1052" r="10" opacity="0" /><circle cx="228" cy="1068" r="9" opacity="0" /><circle cx="343" cy="1092" r="9" opacity="0" />
              <circle cx="652" cy="1092" r="9" opacity="0" /><circle cx="678" cy="1100" r="8" opacity="0" /><circle cx="545" cy="912" r="9" opacity="0" />
              <circle cx="700" cy="918" r="8" opacity="0" /><circle cx="60" cy="1050" r="8" opacity="0" />
            </g>
            <circle id="sp-tag-glow" cx="714" cy="850" r="60" fill="url(#spGlow)" opacity="0" />
          </g>
          <!-- roue de chargement (remplace celle du visuel, à l'identique, mais animée) -->
          <circle cx="472" cy="1452" r="35" fill="none" stroke="#04476d" stroke-width="14" />
          <circle id="sp-spin" cx="472" cy="1452" r="35" fill="none" stroke="url(#spArc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="70 150" />
          <!-- trois points d'étape (sources, gardes, carte) -->
          <g id="sp-dots">
            <circle cx="438" cy="1570" r="11" fill="#061a32" /><circle cx="471" cy="1570" r="11" fill="#061a32" /><circle cx="504" cy="1570" r="11" fill="#061a32" />
            <circle class="d" cx="438" cy="1570" r="8.5" fill="#074e6f" /><circle class="d" cx="471" cy="1570" r="8.5" fill="#074e6f" /><circle class="d" cx="504" cy="1570" r="8.5" fill="#074e6f" />
          </g>
        </svg>
      </div>
      <p class="sp-live" id="splash-step" aria-live="polite">Chargement…</p>
      <p class="sp-live" id="splash-ver"></p>
    </div>
    <script>
      // Contrôleur de l'écran de lancement : suit le vrai chargement (main.tsx / App.tsx) avec un rythme minimal.
      (function () {
        var s = document.getElementById('splash'); if (!s) return;
        var t0 = Date.now(), seen = false;
        try { seen = sessionStorage.getItem('pgm-splash') === '1'; sessionStorage.setItem('pgm-splash', '1'); } catch (e) {}
        var MIN = seen ? 2600 : 5600;      // durée minimale d'affichage (ms)
        var STEP_MIN = seen ? 550 : 1300;  // chaque étape reste au moins ce temps
        var step = document.getElementById('splash-step');
        var finished = false, queue = [], busy = false, lastShown = Date.now(), onIdle = null, stepIndex = 0;
        var LABEL_DOT = { 'Recherche des pharmacies de garde…': 0, 'Vérification des sources…': 1, 'Préparation de la carte…': 2, 'Prêt': 3 };
        function show(i) { stepIndex = i; if (window.__splashFx) window.__splashFx.step(i); }
        function pump() {
          if (busy) return;
          var next = queue.shift();
          if (!next) { if (onIdle) { var f = onIdle; onIdle = null; f(); } return; }
          busy = true;
          setTimeout(function () {
            step.textContent = next.l;
            if (next.l in LABEL_DOT) show(LABEL_DOT[next.l]);
            lastShown = Date.now(); busy = false; pump();
          }, Math.max(0, STEP_MIN - (Date.now() - lastShown)));
        }
        function set(p, label) { if (finished && p < 100) return; if (label) { queue.push({ l: label }); pump(); } }
        function hide() {
          if (!s.parentNode) return;
          var remove = function () { if (s.parentNode) s.parentNode.removeChild(s); };
          if (window.__splashFx) window.__splashFx.exit(remove);
          else { s.classList.add('sp-out'); setTimeout(remove, 650); }
        }
        function done() {
          if (finished) return; finished = true;
          queue.push({ l: 'Prêt' });
          onIdle = function () { setTimeout(hide, Math.max(0, MIN - (Date.now() - t0)) + 400); };
          pump();
        }
        s.addEventListener('click', function () { finished = true; queue = []; hide(); }); // toucher l'écran pour passer, à tout moment
        window.__splash = { step: set, done: done, current: function () { return stepIndex; } };
        setTimeout(function () { if (!finished) done(); }, 14000); // sécurité : ne jamais bloquer l'accès
      })();
    </script>
    <noscript><style>#splash { display: none; }</style>Cette application nécessite JavaScript.</noscript>
    <script type="module" src="/src/splash.ts"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
