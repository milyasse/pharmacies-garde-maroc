<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B5D3B" />
    <meta name="description" content="Pharmacies de garde autour de vous à Rabat, Salé et Témara : sources datées, carte, classement par proximité et itinéraires." />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet" />
    <title>Pharmacies de Garde Maroc</title>
    <style>
      /* ---------- Écran de lancement (affiché avant le chargement du JavaScript) ---------- */
      #splash {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        display: flex; flex-direction: column; align-items: center;
        background: linear-gradient(180deg, #bfdcf2 0%, #dcecf8 38%, #eef6fb 60%, #f6fafc 100%);
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #12355b; cursor: default; -webkit-user-select: none; user-select: none;
        transition: opacity .55s ease, transform .55s ease, filter .55s ease;
      }
      #splash.sp-out { opacity: 0; transform: scale(1.04); filter: blur(3px); pointer-events: none; }
      #splash .sp-sun { position: absolute; top: -18vh; left: 50%; width: 120vmax; height: 70vh; transform: translateX(-50%);
        background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); opacity: .8; animation: sp-glow 6s ease-in-out infinite alternate; }
      #splash .sp-plus { position: absolute; color: rgba(11,93,59,.16); font-weight: 800; animation: sp-float 7s ease-in-out infinite; }
      #splash .sp-top { position: relative; z-index: 2; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
        padding-top: calc(max(env(safe-area-inset-top), 0px) + min(11vh, 96px)); text-align: center; }
      #splash .sp-logo { position: relative; width: 112px; height: 124px; }
      #splash .sp-pin { position: relative; z-index: 2; width: 112px; height: 124px; filter: drop-shadow(0 12px 18px rgba(11,93,59,.35));
        animation: sp-drop 1.2s cubic-bezier(.2,1.35,.4,1) .2s both; }
      #splash .sp-shadow { position: absolute; left: 50%; bottom: -10px; width: 64px; height: 12px; margin-left: -32px; border-radius: 50%;
        background: rgba(11,60,40,.28); filter: blur(3px); animation: sp-shadow 1.2s cubic-bezier(.2,1.35,.4,1) .2s both; }
      #splash .sp-ring { position: absolute; left: 50%; top: 46%; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
        border: 3px solid rgba(30,138,76,.55); opacity: 0; animation: sp-ring 2.8s cubic-bezier(.2,.7,.3,1) 1s infinite; }
      #splash .sp-ring.r2 { animation-delay: 2.85s; }
      #splash .sp-ring.r1 { animation-delay: 1.93s; }
      #splash h1 { margin: 26px 0 0; font-size: clamp(34px, 10.5vw, 52px); line-height: 1.06; font-weight: 800; letter-spacing: -.02em; }
      #splash h1 > span { display: block; opacity: 0; animation: sp-up 1s cubic-bezier(.2,.8,.2,1) both; }
      #splash h1 .l1 { color: #12355b; animation-delay: .8s; }
      #splash h1 .l2 { animation-delay: 1.05s; }
      #splash h1 .g { color: #1e8a4c; }
      #splash h1 .b { color: #1f5f9e; }
      #splash .sp-cities { margin: 12px 0 0; font-size: 15px; font-weight: 700; letter-spacing: .06em; color: #3d6b8f; opacity: 0; animation: sp-up .9s ease 1.4s both; }
      #splash .sp-photo { position: absolute; left: 0; right: 0; bottom: 0; height: 52%; z-index: 1;
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 28%); mask-image: linear-gradient(180deg, transparent 0%, #000 28%);
        animation: sp-fade 1.8s ease .3s both; }
      #splash .sp-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 46% 30%; display: block;
        animation: sp-kb 16s ease-out .3s both; }
      #splash .sp-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,38,66,0) 45%, rgba(10,38,66,.5) 72%, rgba(8,30,54,.9) 100%); }
      #splash .sp-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; flex-direction: column; align-items: center;
        padding: 0 24px calc(max(env(safe-area-inset-bottom), 0px) + 34px); text-align: center; }
      #splash .sp-tag { margin: 0 0 22px; color: #fff; font-style: italic; font-weight: 700; font-size: clamp(24px, 7vw, 32px); line-height: 1.2;
        text-shadow: 0 2px 14px rgba(0,0,0,.35); opacity: 0; animation: sp-up 1s cubic-bezier(.2,.8,.2,1) 1.7s both; }
      #splash .sp-bar { position: relative; width: min(260px, 70vw); height: 6px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.22);
        opacity: 0; animation: sp-fade .6s ease 2s both; }
      #splash .sp-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 6%; border-radius: 6px;
        background: linear-gradient(90deg, #5dbb63, #b9f0bd); transition: width .9s cubic-bezier(.3,.7,.2,1); }
      #splash .sp-bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);
        transform: translateX(-100%); animation: sp-shine 1.6s ease-in-out infinite; }
      #splash .sp-step { margin: 12px 0 0; min-height: 18px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.88); transition: opacity .25s ease;
        opacity: 0; animation: sp-fade .6s ease 2.1s both; }
      #splash .sp-step.sw { opacity: 0 !important; }
      #splash .sp-ver { margin: 10px 0 0; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.5); }
      @keyframes sp-drop { 0% { opacity: 0; transform: translateY(-70px) scale(.7); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes sp-shadow { 0% { opacity: 0; transform: scaleX(.3); } 100% { opacity: 1; transform: none; } }
      @keyframes sp-ring { 0% { opacity: .75; transform: scale(.45); } 100% { opacity: 0; transform: scale(2.3); } }
      @keyframes sp-up { 0% { opacity: 0; transform: translateY(18px); } 100% { opacity: 1; transform: none; } }
      @keyframes sp-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sp-kb { 0% { transform: scale(1.16) translateY(14px); } 100% { transform: scale(1.02) translateY(0); } }
      @keyframes sp-shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      @keyframes sp-glow { from { opacity: .55; } to { opacity: .95; } }
      @keyframes sp-float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(8deg); } }
      @media (min-width: 900px) { #splash .sp-photo { left: 50%; right: auto; width: min(100%, 980px); height: 55%; transform: translateX(-50%); -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 22%), linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(180deg, transparent 0%, #000 22%), linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%); mask-composite: intersect; } #splash .sp-photo img { object-position: 45% 12%; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
        #splash .sp-ring { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Chargement de Pharmacies de Garde Maroc">
      <div class="sp-sun"></div>
      <span class="sp-plus" style="left:12%;top:18%;font-size:22px">+</span>
      <span class="sp-plus" style="right:14%;top:12%;font-size:30px;animation-delay:-2s">+</span>
      <span class="sp-plus" style="right:22%;top:34%;font-size:18px;animation-delay:-4s">+</span>
      <span class="sp-plus" style="left:20%;top:40%;font-size:16px;animation-delay:-5s">+</span>
      <div class="sp-top">
        <div class="sp-logo" aria-hidden="true">
          <span class="sp-ring"></span><span class="sp-ring r1"></span><span class="sp-ring r2"></span>
          <svg class="sp-pin" viewBox="0 0 120 132" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a9a5a" /><stop offset="1" stop-color="#0b5d3b" /></linearGradient>
              <radialGradient id="sph" cx=".35" cy=".25" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".35" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
            </defs>
            <path d="M60 4C30 4 7 27 7 56c0 39 53 72 53 72s53-33 53-72C113 27 90 4 60 4z" fill="url(#spg)" />
            <path d="M60 4C30 4 7 27 7 56c0 39 53 72 53 72s53-33 53-72C113 27 90 4 60 4z" fill="url(#sph)" />
            <circle cx="60" cy="56" r="36" fill="#fff" />
            <path d="M51 34h18v13h13v18H69v13H51V65H38V47h13z" fill="#1e8a4c" />
          </svg>
          <span class="sp-shadow"></span>
        </div>
        <h1><span class="l1">Pharmacies</span><span class="l2"><span class="g">de Garde</span> <span class="b">Maroc</span></span></h1>
        <p class="sp-cities">Rabat · Salé · Témara</p>
      </div>
      <div class="sp-photo" aria-hidden="true"><img src="/src/assets/splash-hassan.webp" alt="" width="1056" height="875" decoding="async" fetchpriority="high" /></div>
      <div class="sp-bottom">
        <p class="sp-tag">Toujours proche<br />de vous</p>
        <div class="sp-bar" aria-hidden="true"><i></i></div>
        <p class="sp-step" id="splash-step">Démarrage…</p>
        <p class="sp-ver" id="splash-ver"></p>
      </div>
    </div>
    <script>
      // Pilotage de l'écran de lancement : progression réelle (main.tsx / App.tsx) + durée minimale pour l'animation.
      (function () {
        var s = document.getElementById('splash'); if (!s) return;
        var t0 = Date.now(), seen = false;
        try { seen = sessionStorage.getItem('pgm-splash') === '1'; sessionStorage.setItem('pgm-splash', '1'); } catch (e) {}
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var MIN = seen ? 1200 : reduce ? 1200 : 4200;   // durée minimale d'affichage (ms)
        var STEP_MIN = seen ? 300 : 900;                 // chaque message reste lisible au moins ce temps
        var bar = s.querySelector('.sp-bar i'), step = document.getElementById('splash-step');
        var pct = 4, finished = false, queue = [], busy = false, lastShown = 0, onIdle = null;
        function width(p) { pct = Math.max(pct, p); bar.style.width = pct + '%'; }
        function pump() {
          if (busy) return;
          var next = queue.shift();
          if (!next) { if (onIdle) { var f = onIdle; onIdle = null; f(); } return; }
          busy = true;
          var wait = Math.max(0, STEP_MIN - (Date.now() - lastShown));
          setTimeout(function () {
            width(next.p);
            if (next.l && step.textContent !== next.l) {
              step.classList.add('sw');
              setTimeout(function () { step.textContent = next.l; step.classList.remove('sw'); }, 250);
            }
            lastShown = Date.now(); busy = false; pump();
          }, wait);
        }
        function set(p, label) {
          if (finished && p < 100) return;
          if (!label) { width(p); return; }
          queue.push({ p: p, l: label }); pump();
        }
        var trickle = setInterval(function () { if (pct < 30) width(pct + 1.2); }, 200);
        function hide() {
          if (!s.parentNode) return;
          s.classList.add('sp-out');
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 650);
        }
        function done() {
          if (finished) return; finished = true; clearInterval(trickle);
          queue.push({ p: 100, l: 'Prêt' });
          onIdle = function () { setTimeout(hide, Math.max(0, MIN - (Date.now() - t0)) + 600); };
          pump();
        }
        s.addEventListener('click', function () { if (Date.now() - t0 > 1200) { finished = true; clearInterval(trickle); queue = []; hide(); } });
        window.__splash = { step: set, done: done };
        setTimeout(function () { if (!finished) done(); }, 10000); // sécurité : ne jamais bloquer l'accès
      })();
    </script>
    <noscript><style>#splash { display: none; }</style>Cette application nécessite JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
