name: Agrandissement IA d'une image

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Image source (chemin dans le dépôt)"
        required: true
        default: marketing/source/splash-original.png
      width:
        description: "Largeur finale (px)"
        required: true
        default: "1882"

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Installer Real-ESRGAN (CPU)
        run: |
          pip install --quiet "numpy<2" opencv-python-headless==4.9.0.80
          pip install --quiet torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet basicsr==1.4.2 realesrgan==0.3.0
          curl -fsSL -o RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
      - name: Agrandir
        env:
          SRC: ${{ inputs.source }}
          WIDTH: ${{ inputs.width }}
        run: |
          python scripts/upscale.py "$SRC" "marketing/source/$(basename "${SRC%.*}")-hd.png" "$WIDTH"
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add marketing/source
          git commit -m "Image agrandie par IA (Real-ESRGAN)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
