name: Captures marketing (démo)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/capture.mjs', '.github/workflows/capture.yml']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire l'application
        env:
          BASE_PATH: /pharmacies-garde-maroc/
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Installer Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Captures et vidéo
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 5
          node scripts/capture.mjs
      - name: Vidéo MP4
        run: |
          ffmpeg -y -i marketing/demo-mobile.webm -vf "scale=1080:-2:flags=lanczos,fps=30" -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart marketing/demo-mobile.mp4
          rm -rf marketing/video-raw
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing
          git commit -m "marketing: captures et vidéo de démonstration" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
