name: Débloquer un déploiement Pages

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit du déploiement bloqué à annuler"
        required: true

permissions:
  pages: write
  id-token: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Annuler le déploiement bloqué
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/$SHA/cancel" && echo "Annulé : $SHA" || echo "Rien à annuler pour $SHA"
          gh api "repos/${{ github.repository }}/pages/deployments/$SHA" || true
