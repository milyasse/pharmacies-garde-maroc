name: Débloquer un déploiement Pages

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit du déploiement bloqué à annuler"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Annuler le déploiement bloqué
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p marketing/verif; f=marketing/verif/pages-unstick.txt; : > $f
          echo "== état avant" >> $f; gh api "repos/$REPO/pages/deployments/$SHA" >> $f 2>&1 || true; echo >> $f
          echo "== annulation" >> $f; gh api -X POST "repos/$REPO/pages/deployments/$SHA/cancel" >> $f 2>&1 || true; echo >> $f
          sleep 10
          echo "== état après" >> $f; gh api "repos/$REPO/pages/deployments/$SHA" >> $f 2>&1 || true; echo >> $f
          echo "== déploiements récents" >> $f; gh api "repos/$REPO/deployments?per_page=5" --jq '.[] | (.id|tostring)+" "+.sha[0:7]+" "+.created_at' >> $f 2>&1 || true
          cat $f
      - name: Enregistrer le journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add marketing/verif/pages-unstick.txt
          git commit -m "Journal : déblocage Pages [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
